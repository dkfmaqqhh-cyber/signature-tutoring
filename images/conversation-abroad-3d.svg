<rect x="86" y="78" width="62" height="52" rx="13" fill="url(#case)"/>
<rect x="102" y="80" width="7" height="48" rx="3.5" fill="#2f4770" opacity=".85"/>
<rect x="125" y="80" width="7" height="48" rx="3.5" fill="#2f4770" opacity=".85"/>
<rect x="92" y="84" width="34" height="6" rx="3" fill="#fff" opacity=".5"/>
<circle cx="140" cy="122" r="3" fill="#fffaf0" opacity=".8"/>
