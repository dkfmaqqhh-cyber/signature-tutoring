<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
<!-- [483차] 한글 학습 아이콘: 펼친 책 + '가' 말풍선 · '가'는 글꼴이 아닌 도형(기기별 모양 차이 없음) · 파스텔 입체(클레이) 스타일 · 장식용(alt="") -->
<defs>
  <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1f3557" stop-opacity=".22"/><stop offset="1" stop-color="#1f3557" stop-opacity="0"/></radialGradient>
  <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb6de"/><stop offset="1" stop-color="#6f8ac0"/></linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#efe3c8"/></linearGradient>
  <radialGradient id="bubble" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#fff1c9"/><stop offset=".6" stop-color="#f7d88a"/><stop offset="1" stop-color="#e5b95c"/></radialGradient>
  <linearGradient id="bubbleSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a84a"/><stop offset="1" stop-color="#bf8c3b"/></linearGradient>
</defs>
<ellipse cx="80" cy="142" rx="60" ry="10" fill="url(#sh)"/>
<!-- 펼친 책 -->
<path d="M14 104c22-8 44-8 66 2 22-10 44-10 66-2v28c-22-8-44-8-66 2-22-10-44-10-66-2z" fill="url(#cover)"/>
<path d="M20 100c20-7 40-6 60 3v26c-20-9-40-10-60-3z" fill="url(#page)"/>
<path d="M140 100c-20-7-40-6-60 3v26c20-9 40-10 60-3z" fill="url(#page)"/>
<path d="M30 108c12-3 26-2 40 3M30 116c12-3 26-2 40 3M90 111c14-5 28-6 40-3M90 119c14-5 28-6 40-3" stroke="#e0cfa9" stroke-width="2" stroke-linecap="round" fill="none"/>
<path d="M80 103v26" stroke="#c9b48a" stroke-width="2"/>
<!-- 말풍선: 옆면 → 앞면 -->
<path d="M44 18h72a20 20 0 0 1 20 20v34a20 20 0 0 1-20 20H92l-14 14-6-14H44a20 20 0 0 1-20-20V38a20 20 0 0 1 20-20z" fill="url(#bubbleSide)" transform="translate(0 5)"/>
<path d="M44 18h72a20 20 0 0 1 20 20v34a20 20 0 0 1-20 20H92l-14 14-6-14H44a20 20 0 0 1-20-20V38a20 20 0 0 1 20-20z" fill="url(#bubble)"/>
<ellipse cx="54" cy="29" rx="16" ry="6" fill="#fff" opacity=".55"/>
<!-- '가': ㄱ + ㅏ (굵은 둥근 획) -->
<g stroke="#1f3557" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M50 40H80Q83 40 82 45Q78 66 56 80"/>
  <path d="M100 32V84"/>
  <path d="M100 57H115"/>
</g>
</svg>
