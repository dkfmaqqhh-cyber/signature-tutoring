<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
<!-- [485차] 일본어 학습 책상 일러스트(자체 제작, 인물 없음) · 아치형 프레임(4:5) 안에 주요 소품을 가운데 배치 · 공책 글자 '日'·'ア'는 획 도형(가짜 글자 없음) -->
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3e6"/><stop offset="1" stop-color="#f1e1c9"/></linearGradient>
  <radialGradient id="light" cx="25%" cy="12%" r="70%"><stop offset="0" stop-color="#fffaf0" stop-opacity=".95"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/></radialGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8cda4"/><stop offset="1" stop-color="#d2ad7c"/></linearGradient>
  <linearGradient id="deskEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c49a66"/><stop offset="1" stop-color="#b08655"/></linearGradient>
  <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f6a9c"/><stop offset="1" stop-color="#34497a"/></linearGradient>
  <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f6fd"/><stop offset="1" stop-color="#c9daf1"/></linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3eee4"/><stop offset="1" stop-color="#d7cdb9"/></linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead6"/></linearGradient>
  <linearGradient id="pencil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a0"/><stop offset="1" stop-color="#d9a84a"/></linearGradient>
  <radialGradient id="leaf" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#cdeedb"/><stop offset="1" stop-color="#7fc29f"/></radialGradient>
  <radialGradient id="soft"><stop offset="0" stop-color="#5a3f1e" stop-opacity=".22"/><stop offset="1" stop-color="#5a3f1e" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="1000" fill="url(#wall)"/>
<rect width="800" height="1000" fill="url(#light)"/>
<!-- 벽 선반과 작은 액자(글자 없음) -->
<rect x="470" y="250" width="230" height="16" rx="6" fill="#d7b98d"/>
<rect x="500" y="170" width="70" height="80" rx="10" fill="#edf3ff" stroke="#d7c5a6" stroke-width="6"/>
<circle cx="535" cy="205" r="18" fill="#f2c6a9"/>
<rect x="600" y="196" width="34" height="54" rx="8" fill="#f2eefc" stroke="#d7c5a6" stroke-width="5"/>
<!-- 책상 -->
<rect x="0" y="640" width="800" height="360" fill="url(#desk)"/>
<rect x="0" y="640" width="800" height="14" fill="#f1dcb9" opacity=".7"/>
<rect x="0" y="930" width="800" height="70" fill="url(#deskEdge)"/>
<!-- 화분(오른쪽 뒤) -->
<ellipse cx="660" cy="652" rx="70" ry="12" fill="url(#soft)"/>
<path d="M612 560h96l-12 90h-72z" fill="#f2b892"/>
<rect x="604" y="552" width="112" height="22" rx="8" fill="#f6c6a6"/>
<ellipse cx="626" cy="500" rx="26" ry="58" fill="url(#leaf)" transform="rotate(-28 626 500)"/>
<ellipse cx="694" cy="496" rx="26" ry="60" fill="url(#leaf)" transform="rotate(26 694 496)"/>
<ellipse cx="660" cy="470" rx="24" ry="70" fill="url(#leaf)"/>
<!-- 노트북(가운데 뒤) -->
<ellipse cx="400" cy="648" rx="230" ry="16" fill="url(#soft)"/>
<rect x="232" y="390" width="336" height="226" rx="18" fill="url(#lid)"/>
<rect x="250" y="408" width="300" height="190" rx="10" fill="url(#scr)"/>
<rect x="276" y="434" width="132" height="70" rx="22" fill="#bfe6cf"/>
<path d="M300 500l-8 26 30-22z" fill="#bfe6cf"/>
<circle cx="316" cy="469" r="8" fill="#fff"/><circle cx="342" cy="469" r="8" fill="#fff"/><circle cx="368" cy="469" r="8" fill="#fff"/>
<rect x="420" y="520" width="104" height="52" rx="20" fill="#f8d98e"/>
<path d="M500 568l10 20-26-14z" fill="#f8d98e"/>
<path d="M196 616h408l26 30c4 6 1 12-7 12H177c-8 0-11-6-7-12z" fill="url(#base)"/>
<rect x="356" y="620" width="88" height="10" rx="5" fill="#cfc3ab"/>
<!-- 책 더미(왼쪽) · 책등에 글자 없음 -->
<ellipse cx="150" cy="700" rx="130" ry="14" fill="url(#soft)"/>
<rect x="40" y="636" width="220" height="56" rx="10" fill="#3b5584"/>
<rect x="52" y="644" width="200" height="34" rx="5" fill="#fffaf0"/>
<rect x="40" y="636" width="220" height="12" rx="6" fill="#5f7aae"/>
<rect x="62" y="586" width="196" height="50" rx="10" fill="#9fd2b7"/>
<rect x="74" y="594" width="176" height="30" rx="5" fill="#fffaf0"/>
<rect x="62" y="586" width="196" height="11" rx="5.5" fill="#b9e3cb"/>
<rect x="52" y="544" width="190" height="42" rx="10" fill="#f0c766"/>
<rect x="64" y="551" width="170" height="24" rx="5" fill="#fffaf0"/>
<rect x="52" y="544" width="190" height="10" rx="5" fill="#f8da8f"/>
<!-- 머그(오른쪽 앞) -->
<ellipse cx="650" cy="772" rx="70" ry="14" fill="url(#soft)"/>
<path d="M694 700h18a30 30 0 0 1 0 60h-18" stroke="#efe6d6" stroke-width="16" fill="none"/>
<rect x="596" y="672" width="104" height="100" rx="18" fill="#fffaf0"/>
<rect x="596" y="712" width="104" height="18" fill="#f0c766"/>
<ellipse cx="648" cy="674" rx="52" ry="10" fill="#e8dcc6"/>
<ellipse cx="648" cy="676" rx="44" ry="7" fill="#9b6b3d"/>
<!-- 펼친 공책(가운데 앞) -->
<ellipse cx="390" cy="900" rx="250" ry="20" fill="url(#soft)"/>
<path d="M160 718 390 740 390 890 140 872Z" fill="#e7dcc4"/>
<path d="M620 718 390 740 390 890 640 872Z" fill="#e7dcc4"/>
<path d="M168 708 390 730 390 880 150 862Z" fill="url(#page)"/>
<path d="M612 708 390 730 390 880 630 862Z" fill="url(#page)"/>
<path d="M390 730v150" stroke="#d9cbb0" stroke-width="4"/>
<g stroke="#e3d6bb" stroke-width="3" stroke-linecap="round">
  <path d="M416 760 594 746M414 790 598 776M412 820 602 806M410 850 606 836"/>
</g>
<!-- 공책 왼쪽: '日'과 'ア' 획(네이비) -->
<g stroke="#1f3557" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M206 760 260 765 256 840 200 835Z"/>
  <path d="M203 798 258 803"/>
  <path d="M296 772H352Q350 787 334 799"/>
  <path d="M322 786Q323 812 304 828"/>
</g>
<!-- 연필 -->
<g transform="translate(540 880) rotate(-14)">
  <rect x="-110" y="-9" width="16" height="18" rx="6" fill="#f6b98f"/>
  <rect x="-96" y="-9" width="10" height="18" fill="#c9cfdb"/>
  <rect x="-87" y="-9" width="120" height="18" fill="url(#pencil)"/>
  <path d="M33 -9 54 0 33 9Z" fill="#f3dfbf"/>
  <path d="M47 -3 54 0 47 3Z" fill="#1f3557"/>
</g>
<!-- 단어 카드(글자 대신 색 띠) -->
<g transform="rotate(-8 700 860)">
  <rect x="640" y="820" width="110" height="74" rx="10" fill="#fffaf0" stroke="#e3d6bb" stroke-width="3"/>
  <rect x="656" y="838" width="78" height="10" rx="5" fill="#c3d6ef"/>
  <rect x="656" y="858" width="54" height="10" rx="5" fill="#f2c6a9"/>
</g>
</svg>
